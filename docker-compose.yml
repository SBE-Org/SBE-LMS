# Start everything:   docker compose up -d
# Then open http://localhost:8080 — the first visit shows the installer.
services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: shaggar_lms
      DB_USER: shaggar
      DB_PASS: change-this-password
      APP_TIMEZONE: Africa/Addis_Ababa
    volumes:
      - uploads:/var/www/html/backend/storage/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: shaggar_lms
      MARIADB_USER: shaggar
      MARIADB_PASSWORD: change-this-password
      MARIADB_ROOT_PASSWORD: change-this-root-password
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  dbdata:
  uploads:
